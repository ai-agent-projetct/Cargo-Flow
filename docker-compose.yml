version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cargoflo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: cargoflo123
      MYSQL_DATABASE: cargoflo_db
    ports:
      - "3306:3306"
    volumes:
      - cargoflo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cargoflo_mysql_data:
